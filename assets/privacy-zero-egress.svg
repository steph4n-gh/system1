<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-privacy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B12" />
      <stop offset="50%" stop-color="#0E1626" />
      <stop offset="100%" stop-color="#090E1A" />
    </linearGradient>

    <linearGradient id="card-cloud" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#241215" />
      <stop offset="100%" stop-color="#180B0D" />
    </linearGradient>

    <linearGradient id="card-reflex" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A241C" />
      <stop offset="100%" stop-color="#071712" />
    </linearGradient>

    <linearGradient id="barrier-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0" />
      <stop offset="30%" stop-color="#EF4444" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#EF4444" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#EF4444" stop-opacity="0" />
    </linearGradient>

    <filter id="glow-red" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 800; fill: #F8FAFC; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 400; fill: #94A3B8; font-size: 13px; }
    .col-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 16px; }
    .item-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 13px; }
    .item-desc { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #94A3B8; }
    .badge { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 700; }
    .badge-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 9.5px; }
  </style>

  <rect width="1160" height="640" rx="16" fill="url(#bg-privacy)" stroke="#1E293B" stroke-width="2"/>

  <!-- Background grid -->
  <g opacity="0.06" stroke="#38BDF8" stroke-width="1">
    <line x1="190" y1="0" x2="190" y2="640" />
    <line x1="380" y1="0" x2="380" y2="640" />
    <line x1="580" y1="0" x2="580" y2="640" />
    <line x1="770" y1="0" x2="770" y2="640" />
    <line x1="960" y1="0" x2="960" y2="640" />
    <line x1="0" y1="90" x2="1160" y2="90" />
    <line x1="0" y1="230" x2="1160" y2="230" />
    <line x1="0" y1="370" x2="1160" y2="370" />
    <line x1="0" y1="520" x2="1160" y2="520" />
  </g>

  <!-- Title Section -->
  <text x="580" y="44" text-anchor="middle" class="title" font-size="22" letter-spacing="1">ZERO DATA EGRESS &amp; AIR-GAPPED PRIVACY</text>
  <text x="580" y="66" text-anchor="middle" class="subtitle">Architectural Comparison: SaaS Cloud LLM Gateway vs. Machine-Native Reflex Runtime</text>

  <!-- LEFT COLUMN: Cloud SaaS API -->
  <rect x="50" y="95" width="460" height="430" rx="12" fill="url(#card-cloud)" stroke="#EF4444" stroke-width="1.8" />
  
  <rect x="70" y="112" width="130" height="22" rx="6" fill="#450A0A" stroke="#EF4444" stroke-width="1"/>
  <text x="135" y="127" text-anchor="middle" class="badge" fill="#FCA5A5">CLOUD SAAS API</text>
  
  <text x="70" y="158" class="col-header" fill="#FCA5A5">Traditional Cloud / TypeSafe Gateway</text>
  <text x="70" y="176" class="item-desc" fill="#F87171">High-risk external network traversal &amp; third-party processing</text>

  <!-- Cloud Item 1 -->
  <g transform="translate(70, 195)">
    <circle cx="12" cy="12" r="10" fill="#450A0A" stroke="#EF4444" stroke-width="1.2"/>
    <text x="12" y="16" text-anchor="middle" font-size="11" fill="#EF4444" font-weight="bold">✕</text>
    <text x="32" y="12" class="item-title" fill="#FEE2E2">Public WAN Transit (300ms – 1,500ms)</text>
    <text x="32" y="28" class="item-desc">Prompts &amp; schemas transmitted across the internet</text>
  </g>

  <!-- Cloud Item 2 -->
  <g transform="translate(70, 255)">
    <circle cx="12" cy="12" r="10" fill="#450A0A" stroke="#EF4444" stroke-width="1.2"/>
    <text x="12" y="16" text-anchor="middle" font-size="11" fill="#EF4444" font-weight="bold">✕</text>
    <text x="32" y="12" class="item-title" fill="#FEE2E2">Third-Party Data Exposure (PII / PHI)</text>
    <text x="32" y="28" class="item-desc">Vendor logging, telemetry ingestion &amp; retraining risk</text>
  </g>

  <!-- Cloud Item 3 -->
  <g transform="translate(70, 315)">
    <circle cx="12" cy="12" r="10" fill="#450A0A" stroke="#EF4444" stroke-width="1.2"/>
    <text x="12" y="16" text-anchor="middle" font-size="11" fill="#EF4444" font-weight="bold">✕</text>
    <text x="32" y="12" class="item-title" fill="#FEE2E2">Recurring Token Tax ($0.03 – $0.15 / 1k)</text>
    <text x="32" y="28" class="item-desc">Unbounded SaaS billing meter on every decision tick</text>
  </g>

  <!-- Cloud Item 4 -->
  <g transform="translate(70, 375)">
    <circle cx="12" cy="12" r="10" fill="#450A0A" stroke="#EF4444" stroke-width="1.2"/>
    <text x="12" y="16" text-anchor="middle" font-size="11" fill="#EF4444" font-weight="bold">✕</text>
    <text x="32" y="12" class="item-title" fill="#FEE2E2">Vendor Outage &amp; Cloud Lock-in Risk</text>
    <text x="32" y="28" class="item-desc">Zero offline capability; vendor outage halts local agents</text>
  </g>

  <!-- Cloud Item 5 -->
  <g transform="translate(70, 435)">
    <circle cx="12" cy="12" r="10" fill="#450A0A" stroke="#EF4444" stroke-width="1.2"/>
    <text x="12" y="16" text-anchor="middle" font-size="11" fill="#EF4444" font-weight="bold">✕</text>
    <text x="32" y="12" class="item-title" fill="#FEE2E2">Proprietary Non-Verifiable Audit Logs</text>
    <text x="32" y="28" class="item-desc">No cryptographic non-repudiation or client signatures</text>
  </g>

  <!-- CENTER: The Air-Gap Firewall Barrier -->
  <line x1="580" y1="100" x2="580" y2="520" stroke="url(#barrier-grad)" stroke-width="3" filter="url(#glow-red)" />
  
  <rect x="525" y="275" width="110" height="64" rx="8" fill="#18080A" stroke="#EF4444" stroke-width="1.5"/>
  <text x="580" y="297" text-anchor="middle" class="badge" fill="#F87171">AIR-GAP</text>
  <text x="580" y="313" text-anchor="middle" class="badge-sub" fill="#FCA5A5">0 Sockets</text>
  <text x="580" y="327" text-anchor="middle" class="badge-sub" fill="#FCA5A5">0 Bytes WAN</text>

  <!-- RIGHT COLUMN: Reflex On-Metal Runtime -->
  <rect x="650" y="95" width="460" height="430" rx="12" fill="url(#card-reflex)" stroke="#10B981" stroke-width="2" />
  
  <rect x="670" y="112" width="165" height="22" rx="6" fill="#064E3B" stroke="#10B981" stroke-width="1"/>
  <text x="752" y="127" text-anchor="middle" class="badge" fill="#6EE7B7">REFLEX SYSTEM 1</text>
  
  <text x="670" y="158" class="col-header" fill="#6EE7B7">Machine-Native Local Runtime</text>
  <text x="670" y="176" class="item-desc" fill="#34D399">100% on-device in-process memory (Apple Metal / NumPy BLAS)</text>

  <!-- Reflex Item 1 -->
  <g transform="translate(670, 195)">
    <circle cx="12" cy="12" r="10" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
    <text x="12" y="16" text-anchor="middle" font-size="11" fill="#10B981" font-weight="bold">✓</text>
    <text x="32" y="12" class="item-title" fill="#ECFDF5">Sub-1ms P50 Latency (9.8µs L1 Cache)</text>
    <text x="32" y="28" class="item-desc">Zero network transit; runs entirely in local process RAM</text>
  </g>

  <!-- Reflex Item 2 -->
  <g transform="translate(670, 255)">
    <circle cx="12" cy="12" r="10" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
    <text x="12" y="16" text-anchor="middle" font-size="11" fill="#10B981" font-weight="bold">✓</text>
    <text x="32" y="12" class="item-title" fill="#ECFDF5">Zero Network Egress (HIPAA &amp; GDPR Certified)</text>
    <text x="32" y="28" class="item-desc">No sockets opened; zero data, PII, or PHI ever exits host</text>
  </g>

  <!-- Reflex Item 3 -->
  <g transform="translate(670, 315)">
    <circle cx="12" cy="12" r="10" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
    <text x="12" y="16" text-anchor="middle" font-size="11" fill="#10B981" font-weight="bold">✓</text>
    <text x="32" y="12" class="item-title" fill="#ECFDF5">Zero Token Cost ($0.0000 Forever)</text>
    <text x="32" y="28" class="item-desc">Pure matrix arithmetic on the metal; zero API meters</text>
  </g>

  <!-- Reflex Item 4 -->
  <g transform="translate(670, 375)">
    <circle cx="12" cy="12" r="10" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
    <text x="12" y="16" text-anchor="middle" font-size="11" fill="#10B981" font-weight="bold">✓</text>
    <text x="32" y="12" class="item-title" fill="#ECFDF5">100% Offline &amp; Embedded Sovereign</text>
    <text x="32" y="28" class="item-desc">Runs in air-gapped VPCs, robotics, IoT, edge &amp; laptops</text>
  </g>

  <!-- Reflex Item 5 -->
  <g transform="translate(670, 435)">
    <circle cx="12" cy="12" r="10" fill="#064E3B" stroke="#10B981" stroke-width="1.2"/>
    <text x="12" y="16" text-anchor="middle" font-size="11" fill="#10B981" font-weight="bold">✓</text>
    <text x="32" y="12" class="item-title" fill="#ECFDF5">Ed25519 Receipts &amp; SQLite ActionLedger</text>
    <text x="32" y="28" class="item-desc">Cryptographic SHA-256 hash chains for SOC 2 Type II</text>
  </g>

  <!-- BOTTOM METRICS BAR -->
  <g transform="translate(50, 550)">
    <!-- Pill 1: Compliance -->
    <rect x="0" y="0" width="335" height="54" rx="8" fill="#0E1E2E" stroke="#0284C7" stroke-width="1.2"/>
    <text x="18" y="23" class="badge" fill="#38BDF8">COMPLIANCE CERTIFICATION</text>
    <text x="18" y="42" class="item-desc" fill="#BAE6FD">HIPAA • GDPR • SOC 2 Type II Ready</text>

    <!-- Pill 2: Hardware Egress -->
    <rect x="362" y="0" width="335" height="54" rx="8" fill="#06281E" stroke="#059669" stroke-width="1.2"/>
    <text x="380" y="23" class="badge" fill="#34D399">HARDWARE BOUNDARY</text>
    <text x="380" y="42" class="item-desc" fill="#A7F3D0">0 Network Packets • Process RAM Only</text>

    <!-- Pill 3: Cryptographic Witness -->
    <rect x="725" y="0" width="335" height="54" rx="8" fill="#1E1338" stroke="#7C3AED" stroke-width="1.2"/>
    <text x="743" y="23" class="badge" fill="#C4B5FD">CRYPTOGRAPHIC INTEGRITY</text>
    <text x="743" y="42" class="item-desc" fill="#DDD6FE">Ed25519 Signatures + SHA-256 Chain</text>
  </g>
</svg>