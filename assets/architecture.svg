<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>
    <linearGradient id="card-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2439" />
      <stop offset="100%" stop-color="#0B192C" />
    </linearGradient>
    <linearGradient id="card-amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261E14" />
      <stop offset="100%" stop-color="#19150E" />
    </linearGradient>
    <linearGradient id="card-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A241C" />
      <stop offset="100%" stop-color="#071913" />
    </linearGradient>
    <linearGradient id="card-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1338" />
      <stop offset="100%" stop-color="#130C24" />
    </linearGradient>

    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#06B6D4" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10B981" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#F59E0B" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#A855F7" />
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #F8FAFC; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 400; fill: #94A3B8; font-size: 13px; }
    .node-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 15px; }
    .node-desc { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11.5px; fill: #94A3B8; }
    .badge { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; font-weight: 600; }
    .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
  </style>

  <rect width="1000" height="680" rx="16" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="2"/>

  <g opacity="0.07" stroke="#38BDF8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="680" />
    <line x1="250" y1="0" x2="250" y2="680" />
    <line x1="500" y1="0" x2="500" y2="680" />
    <line x1="750" y1="0" x2="750" y2="680" />
    <line x1="900" y1="0" x2="900" y2="680" />
    <line x1="0" y1="80" x2="1000" y2="80" />
    <line x1="0" y1="200" x2="1000" y2="200" />
    <line x1="0" y1="360" x2="1000" y2="360" />
    <line x1="0" y1="520" x2="1000" y2="520" />
  </g>

  <text x="500" y="44" text-anchor="middle" class="title" font-size="22" letter-spacing="1">REFLEX DUAL-PROCESS ARCHITECTURE</text>
  <text x="500" y="66" text-anchor="middle" class="subtitle">System 1 Fast Reflex Engine • Conformal Ambiguity Gating • System 2 Deliberation &amp; Online Distillation</text>

  <!-- 1. Input Node -->
  <rect x="340" y="90" width="320" height="52" rx="8" fill="#1E293B" stroke="#475569" stroke-width="1.5" />
  <text x="500" y="113" text-anchor="middle" class="node-title" fill="#F1F5F9">INPUT PROMPT / ACTION PROPOSAL</text>
  <text x="500" y="131" text-anchor="middle" class="node-desc">Multi-field schema request (zero network egress)</text>

  <!-- Flow 1 -> 2 -->
  <line x1="500" y1="142" x2="500" y2="175" stroke="#06B6D4" stroke-width="2" marker-end="url(#arrow-cyan)" />

  <!-- 2. System 1 Reflex Engine -->
  <rect x="220" y="178" width="560" height="118" rx="10" fill="url(#card-cyan)" stroke="#06B6D4" stroke-width="2" />
  <rect x="236" y="190" width="165" height="20" rx="10" fill="#0E7490" opacity="0.4"/>
  <text x="318" y="204" text-anchor="middle" class="badge" fill="#38BDF8">SYSTEM 1 (MACHINE-NATIVE)</text>
  
  <text x="236" y="232" class="node-title" fill="#E0F2FE">On-Device Reflex Engine (Non-Autoregressive)</text>
  <text x="236" y="254" class="node-desc">• Matrix Forward Pass: Multi-head linear hyperplanes &amp; MLX Metal / BLAS</text>
  <text x="236" y="271" class="node-desc">• Latency SLA: &lt; 1.0 ms P50 (Sub-10 µs Tier 0 L1 exact cache hit)</text>
  <text x="236" y="287" class="node-desc">• Zero Token Cost: $0.00 / query • 100% on-device • Air-gapped isolation</text>

  <!-- Flow 2 -> 3 -->
  <line x1="500" y1="296" x2="500" y2="330" stroke="#06B6D4" stroke-width="2" marker-end="url(#arrow-cyan)" />
  <rect x="440" y="306" width="120" height="16" rx="4" fill="#090D16" />
  <text x="500" y="318" text-anchor="middle" class="badge" fill="#94A3B8">P(y|x) Credence</text>

  <!-- 3. Conformal Ambiguity Safety Gate -->
  <rect x="200" y="333" width="600" height="106" rx="10" fill="#141E33" stroke="#38BDF8" stroke-width="1.8" />
  <rect x="216" y="345" width="200" height="20" rx="10" fill="#0284C7" opacity="0.3"/>
  <text x="316" y="359" text-anchor="middle" class="badge" fill="#7DD3FC">CONFORMAL AMBIGUITY GATE</text>
  
  <text x="216" y="386" class="node-title" fill="#BAE6FD">Mathematical Safety &amp; Margin Dominance Verification</text>
  <text x="216" y="408" class="node-desc">• Finite-Sample Coverage: P(Y* ∈ C_α(X)) ≥ 1 - α guarantee</text>
  <text x="216" y="425" class="node-desc">• Margin Gating: M(x) = s_(1) - s_(2) ≥ τ (Early clear-winner dominance)</text>

  <!-- Split Flow: Pass Gate (Left) and Halt (Right) -->
  <path d="M 330 439 L 330 495 L 260 495 L 260 520" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#arrow-green)" />
  <rect x="200" y="468" width="125" height="18" rx="4" fill="#0A241C" stroke="#10B981" stroke-width="1"/>
  <text x="262" y="481" text-anchor="middle" class="label" fill="#34D399">Clear Winner (Pass)</text>

  <path d="M 670 439 L 670 495 L 740 495 L 740 520" fill="none" stroke="#F59E0B" stroke-width="2" marker-end="url(#arrow-amber)" />
  <rect x="675" y="468" width="130" height="18" rx="4" fill="#261E14" stroke="#F59E0B" stroke-width="1"/>
  <text x="740" y="481" text-anchor="middle" class="label" fill="#FBBF24">Ambiguous (Halt)</text>

  <!-- 4. Execute on Metal (Left Bottom Card) -->
  <rect x="60" y="523" width="400" height="124" rx="10" fill="url(#card-green)" stroke="#10B981" stroke-width="2" />
  <text x="80" y="550" class="node-title" fill="#A7F3D0">EXECUTE ON THE METAL</text>
  <text x="80" y="572" class="node-desc">• Sub-2ms local action dispatch (95% - 99% of traffic)</text>
  <text x="80" y="591" class="node-desc">• Append-only SQLite ActionLedger with SHA-256 chain</text>
  <text x="80" y="610" class="node-desc">• Ed25519 cryptographic receipt: RunWitnessEnvelope</text>
  <text x="80" y="630" class="node-desc">• Zero latency jitter, pure local compute</text>

  <!-- 5. System 2 Deliberate Governor (Right Bottom Card) -->
  <rect x="540" y="523" width="400" height="124" rx="10" fill="url(#card-amber)" stroke="#F59E0B" stroke-width="2" />
  <text x="560" y="550" class="node-title" fill="#FDE68A">SYSTEM 2: DELIBERATE GOVERNOR</text>
  <text x="560" y="572" class="node-desc">• Frontier Model (Astra / Fable / Gemini / Grok)</text>
  <text x="560" y="591" class="node-desc">• Multi-turn strategic reasoning, human escalation</text>
  <text x="560" y="610" class="node-desc">• Invoked only on 1% - 5% edge cases &amp; safety anomalies</text>
  <text x="560" y="630" class="node-desc">• Resolves definitive target decision y*</text>

  <!-- 6. Sherman-Morrison Distillation Loop (Bottom to Top) -->
  <path d="M 940 585 L 975 585 L 975 237 L 785 237" fill="none" stroke="#A855F7" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-purple)" />
  
  <rect x="830" y="380" width="160" height="42" rx="6" fill="url(#card-purple)" stroke="#A855F7" stroke-width="1.5" />
  <text x="910" y="398" text-anchor="middle" class="badge" fill="#D8B4FE">SHERMAN-MORRISON</text>
  <text x="910" y="413" text-anchor="middle" class="node-desc" fill="#E9D5FF">&lt; 50µs Rank-1 Adaptation</text>
</svg>
