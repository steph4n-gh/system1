<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-scatter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <radialGradient id="optimal-glow" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.0" />
    </radialGradient>

    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #F8FAFC; font-size: 20px; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 400; fill: #94A3B8; font-size: 13px; }
    .axis-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 12px; fill: #CBD5E1; }
    .axis-tick { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; fill: #64748B; }
    .point-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; font-size: 12px; fill: #F1F5F9; }
    .point-sub { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 10px; fill: #94A3B8; }
    .quadrant-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; font-size: 11px; letter-spacing: 1px; fill: #38BDF8; }
  </style>

  <rect width="1020" height="520" rx="14" fill="url(#bg-scatter)" stroke="#1E293B" stroke-width="2"/>

  <!-- Header -->
  <text x="50" y="44" class="title">DECISION QUALITY VS. LATENCY LANDSCAPE</text>
  <text x="50" y="66" class="sub">Macro-F1 Decision Accuracy vs. P50 Latency (Logarithmic Scale) Across Decision Paradigms</text>

  <!-- Plot Area: x=100..940 (width 840), y=110..440 (height 330) -->
  <!-- Target Optimal Zone (Top Left) -->
  <rect x="100" y="110" width="360" height="180" rx="8" fill="url(#optimal-glow)" stroke="#06B6D4" stroke-opacity="0.3" stroke-dasharray="4,4" />
  <text x="120" y="135" class="quadrant-label">OPTIMAL ZONE (HIGH ACCURACY &amp; SUB-1MS SLA)</text>

  <!-- Grid Lines (Horizontal: F1 from 0.70 to 1.00) -->
  <!-- y range: 1.00 at 110, 0.90 at 220, 0.80 at 330, 0.70 at 440 -->
  <line x1="100" y1="110" x2="940" y2="110" stroke="#1E293B" stroke-width="1" />
  <text x="65" y="114" class="axis-tick">1.00</text>
  <line x1="100" y1="220" x2="940" y2="220" stroke="#1E293B" stroke-width="1" />
  <text x="65" y="224" class="axis-tick">0.90</text>
  <line x1="100" y1="330" x2="940" y2="330" stroke="#1E293B" stroke-width="1" />
  <text x="65" y="334" class="axis-tick">0.80</text>
  <line x1="100" y1="440" x2="940" y2="440" stroke="#334155" stroke-width="1.5" />
  <text x="65" y="444" class="axis-tick">0.70</text>

  <!-- Grid Lines (Vertical: Latency Log scale) -->
  <!-- 0.01ms (x=160), 0.1ms (x=300), 1ms (x=440), 10ms (x=580), 100ms (x=720), 1000ms (x=860) -->
  <line x1="160" y1="110" x2="160" y2="440" stroke="#1E293B" stroke-width="1" />
  <text x="145" y="462" class="axis-tick">0.01ms</text>
  <line x1="300" y1="110" x2="300" y2="440" stroke="#1E293B" stroke-width="1" />
  <text x="288" y="462" class="axis-tick">0.1ms</text>
  <line x1="440" y1="110" x2="440" y2="440" stroke="#1E293B" stroke-width="1" />
  <text x="432" y="462" class="axis-tick">1ms</text>
  <line x1="580" y1="110" x2="580" y2="440" stroke="#1E293B" stroke-width="1" />
  <text x="570" y="462" class="axis-tick">10ms</text>
  <line x1="720" y1="110" x2="720" y2="440" stroke="#1E293B" stroke-width="1" />
  <text x="708" y="462" class="axis-tick">100ms</text>
  <line x1="860" y1="110" x2="860" y2="440" stroke="#1E293B" stroke-width="1" />
  <text x="844" y="462" class="axis-tick">1000ms</text>

  <!-- Axis Titles -->
  <text x="450" y="495" class="axis-title">Decision Latency P50 (Logarithmic Scale)</text>
  <text x="-310" y="40" class="axis-title" transform="rotate(-90)">Decision Accuracy (Macro-F1)</text>

  <!-- 60 FPS / 16.6ms Ceiling marker -->
  <line x1="610" y1="100" x2="610" y2="440" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="3,3" />
  <text x="615" y="425" font-family="ui-monospace, monospace" font-size="10" fill="#EF4444" font-weight="700">60 FPS FRAME BUDGET (16.6ms)</text>

  <!-- DATA POINTS -->

  <!-- 1. System 1 Tier 0 (L1 Exact Cache) -->
  <g transform="translate(160, 155)">
    <circle cx="0" cy="0" r="9" fill="#10B981" filter="url(#glow-cyan)" />
    <circle cx="0" cy="0" r="4" fill="#FFFFFF" />
    <text x="15" y="-5" class="point-label" fill="#34D399">System 1 L1 Cache</text>
    <text x="15" y="10" class="point-sub">0.0098 ms • 0.96 F1</text>
  </g>

  <!-- 2. System 1 (Compiled Expert on Metal) -->
  <g transform="translate(436, 175)">
    <circle cx="0" cy="0" r="10" fill="#06B6D4" filter="url(#glow-cyan)" />
    <circle cx="0" cy="0" r="5" fill="#FFFFFF" />
    <text x="15" y="-6" class="point-label" fill="#38BDF8">★ System 1 (Compiled Expert)</text>
    <text x="15" y="9" class="point-sub">0.98 ms • 0.94 F1 • 0 Bytes</text>
  </g>

  <!-- 3. System 1 Zero-Shot Seed -->
  <g transform="translate(436, 275)">
    <circle cx="0" cy="0" r="7" fill="#0284C7" />
    <text x="15" y="-4" class="point-label" fill="#93C5FD">System 1 (Zero-Shot)</text>
    <text x="15" y="10" class="point-sub">0.98 ms • 0.85 F1</text>
  </g>

  <!-- 4. DistilBERT ONNX Local -->
  <g transform="translate(625, 285)">
    <circle cx="0" cy="0" r="6" fill="#64748B" />
    <text x="12" y="-3" class="point-label" fill="#94A3B8">DistilBERT (ONNX)</text>
    <text x="12" y="11" class="point-sub">22 ms • 0.84 F1</text>
  </g>

  <!-- 5. Cloud Decision API (SaaS Baseline / TypeSafe Jev) -->
  <g transform="translate(765, 220)">
    <circle cx="0" cy="0" r="7" fill="#F59E0B" />
    <text x="14" y="-4" class="point-label" fill="#FCD34D">Cloud Decision API (SaaS)</text>
    <text x="14" y="10" class="point-sub">220 ms • 0.90 F1 • Egress</text>
  </g>

  <!-- 6. Local 8B LLM (vLLM / Ollama) -->
  <g transform="translate(750, 235)">
    <circle cx="0" cy="0" r="6" fill="#A855F7" />
    <text x="-160" y="5" class="point-label" fill="#D8B4FE">Local 8B LLM</text>
    <text x="-160" y="19" class="point-sub">180 ms • 0.89 F1</text>
  </g>

  <!-- 7. Frontier Deliberative Governor (GPT-6, Claude Opus 5, Gemini 3.1) -->
  <g transform="translate(850, 145)">
    <circle cx="0" cy="0" r="8" fill="#EC4899" />
    <text x="-210" y="-5" class="point-label" fill="#F472B6">Frontier Reasoning Model</text>
    <text x="-210" y="9" class="point-sub">850 ms • 0.97 F1 • $20/MTok</text>
  </g>

</svg>
