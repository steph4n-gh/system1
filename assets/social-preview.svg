<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070A10" />
      <stop offset="60%" stop-color="#0C1322" />
      <stop offset="100%" stop-color="#080D1A" />
    </linearGradient>
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)" />

  <!-- Grid pattern -->
  <g opacity="0.08" stroke="#38BDF8" stroke-width="1">
    <line x1="160" y1="0" x2="160" y2="640" />
    <line x1="320" y1="0" x2="320" y2="640" />
    <line x1="480" y1="0" x2="480" y2="640" />
    <line x1="640" y1="0" x2="640" y2="640" />
    <line x1="800" y1="0" x2="800" y2="640" />
    <line x1="960" y1="0" x2="960" y2="640" />
    <line x1="1120" y1="0" x2="1120" y2="640" />
    <line x1="0" y1="160" x2="1280" y2="160" />
    <line x1="0" y1="320" x2="1280" y2="320" />
    <line x1="0" y1="480" x2="1280" y2="480" />
  </g>

  <!-- Glowing circuit lines -->
  <g opacity="0.25" stroke="url(#cyan-glow)" stroke-width="2" fill="none">
    <path d="M 120 320 L 220 320 L 280 260 L 400 260" />
    <circle cx="400" cy="260" r="4" fill="#06B6D4" />
    <path d="M 880 380 L 1000 380 L 1060 440 L 1160 440" />
    <circle cx="880" cy="380" r="4" fill="#10B981" />
  </g>

  <!-- Icon Logo Frame -->
  <g transform="translate(100, 190)">
    <rect width="180" height="180" rx="36" fill="#0E1726" stroke="#1E293B" stroke-width="3" />
    <!-- Lightning Bolt inside network -->
    <path d="M 95 30 L 55 100 L 88 100 L 75 150 L 125 80 L 92 80 Z" fill="url(#bolt)" filter="url(#glow)" />
  </g>

  <!-- Typography -->
  <g transform="translate(320, 230)">
    <text x="0" y="50" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="900" font-size="72" fill="#F8FAFC" letter-spacing="2">SYSTEM 1</text>
    <text x="320" y="50" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="500" font-size="28" fill="#38BDF8">v0.1.0</text>
    <text x="0" y="95" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="600" font-size="26" fill="#38BDF8">Machine-Native Dual-Process Decision Runtime</text>
    <text x="0" y="130" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="400" font-size="18" fill="#94A3B8">Sub-1ms P50 latency • Conformal safety gating • Cryptographic Ed25519 receipts • Zero data egress</text>
  </g>

  <!-- Badges / Feature Cards at bottom -->
  <g transform="translate(100, 480)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="245" height="56" rx="10" fill="#0E1A2D" stroke="#0284C7" stroke-width="1.5"/>
    <text x="20" y="24" font-family="ui-monospace, monospace" font-size="11" fill="#7DD3FC">P50 LATENCY</text>
    <text x="20" y="44" font-family="-apple-system, sans-serif" font-weight="700" font-size="16" fill="#F0F9FF">&lt; 1.0 ms (9.8µs cache)</text>

    <!-- Pill 2 -->
    <rect x="270" y="0" width="245" height="56" rx="10" fill="#0A2219" stroke="#059669" stroke-width="1.5"/>
    <text x="290" y="24" font-family="ui-monospace, monospace" font-size="11" fill="#6EE7B7">EGRESS PRIVACY</text>
    <text x="290" y="44" font-family="-apple-system, sans-serif" font-weight="700" font-size="16" fill="#ECFDF5">0% Data Egress (Air-gapped)</text>

    <!-- Pill 3 -->
    <rect x="540" y="0" width="245" height="56" rx="10" fill="#1B172C" stroke="#7C3AED" stroke-width="1.5"/>
    <text x="560" y="24" font-family="ui-monospace, monospace" font-size="11" fill="#C4B5FD">SAFETY GUARANTEE</text>
    <text x="560" y="44" font-family="-apple-system, sans-serif" font-weight="700" font-size="16" fill="#FAF5FF">Conformal (1 - α) Gating</text>

    <!-- Pill 4 -->
    <rect x="810" y="0" width="270" height="56" rx="10" fill="#241B12" stroke="#D97706" stroke-width="1.5"/>
    <text x="830" y="24" font-family="ui-monospace, monospace" font-size="11" fill="#FCD34D">AUDIT WITNESS</text>
    <text x="830" y="44" font-family="-apple-system, sans-serif" font-weight="700" font-size="16" fill="#FFFBEB">Ed25519 Cryptographic Receipt</text>
  </g>
</svg>
