# Experimental template; no authentication/TLS or production permission policy.
# See ../README.md. Do not expose to untrusted callers.
# Example: System 1 gRPC as a sidecar container alongside an agent container.
#
# The agent communicates with the System 1 engine over localhost:50051 (gRPC).
# Both containers share the same network namespace within the pod.
apiVersion: v1
kind: Pod
metadata:
  name: agent-with-reflex-sidecar
  labels:
    app: agent
    sidecar: reflex-grpc
spec:
  containers:
    # ── Primary agent container ──────────────────────────────────────────
    - name: agent
      image: your-agent-image:latest
      ports:
        - containerPort: 8080
          name: http
      env:
        # The agent connects to the System 1 sidecar on localhost.
        - name: REFLEX_GRPC_ENDPOINT
          value: "localhost:50051"
      resources:
        requests:
          cpu: "250m"
          memory: "256Mi"
        limits:
          cpu: "1"
          memory: "1Gi"

    # ── System 1 gRPC sidecar ──────────────────────────────────────────────
    - name: reflex-sidecar
      image: system1-grpc:local
      command: ["system1", "serve", "--grpc", "--port", "50051", "--schema", "guard"]
      ports:
        - containerPort: 50051
          name: grpc
          protocol: TCP
      resources:
        requests:
          cpu: "50m"
          memory: "64Mi"
        limits:
          cpu: "250m"
          memory: "256Mi"
      livenessProbe:
        exec:
          command: ["python", "-c", "import socket; socket.create_connection(('127.0.0.1', 50051), timeout=2).close()"]
        initialDelaySeconds: 10
        periodSeconds: 30
      readinessProbe:
        exec:
          command: ["python", "-c", "import socket; socket.create_connection(('127.0.0.1', 50051), timeout=2).close()"]
        initialDelaySeconds: 5
        periodSeconds: 10
