[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-runtime"
version = "0.1.0"
description = "Reflex: Machine-Native System 1 Decision Runtime with sub-2ms local execution, calibration, conformal prediction, and cryptographic receipts."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "ASTROCYTE Authors"}]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "numpy>=1.24.0",
    "cryptography>=41.0.0",
]

[project.optional-dependencies]
metal = [
    "mlx>=0.10.0",
]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
reflex = "reflex.cli:main"
system1 = "reflex.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
