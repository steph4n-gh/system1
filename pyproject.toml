[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "system1"
version = "0.2.1"
description = "Machine-Native System 1 Decision Runtime with < 1ms P50 latency, conformal safety gating, zero network egress, and Ed25519 receipts."
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "System 1 Authors"}]
requires-python = ">=3.11"
keywords = [
    "reflex",
    "system1",
    "decision-runtime",
    "sub-millisecond",
    "apple-silicon",
    "mlx",
    "conformal-prediction",
    "dual-process",
    "zero-egress",
    "ed25519",
    "audit-receipts",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "numpy>=1.24.0",
    "cryptography>=41.0.0",
]

[project.urls]
Homepage = "https://github.com/steph4n-gh/system1"
Repository = "https://github.com/steph4n-gh/system1.git"
Documentation = "https://github.com/steph4n-gh/system1#readme"
"Issue Tracker" = "https://github.com/steph4n-gh/system1/issues"

[project.optional-dependencies]
metal = [
    "mlx>=0.10.0",
]
neural = [
    "mlx>=0.10.0",
]
gameboy = [
    "pyboy>=2.0.0",
]
observability = [
    "prometheus_client>=0.17.0",
]
otel = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "grpcio>=1.80.0",
    "grpcio-tools>=1.80.0",
    "protobuf>=7.35.1",
    "prometheus_client>=0.17.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]
grpc = [
    "grpcio>=1.80.0",
    "grpcio-tools>=1.80.0",
    "protobuf>=7.35.1",
]

[project.scripts]
system1 = "system1.cli:main"


[tool.setuptools.packages.find]
where = ["src"]
include = ["system1*", "reflex*"]

[tool.setuptools.package-data]
"system1" = ["proto/*.proto", "proto/*.py"]
"reflex" = ["proto/*.proto", "proto/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
