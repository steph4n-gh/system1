name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        exclude:
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.14"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev,langchain]"

      - name: Run Test Suite
        run: |
          pytest -v

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v6
      - name: Check lockfile
        run: uv lock --check
      - name: Check documentation links and release labels
        run: python scripts/check_documentation.py
      - name: Build and validate distributions
        run: |
          uv build
          python scripts/check_distributions.py dist
          uvx twine check --strict dist/*
      - name: Smoke test installed wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/system1-wheel"
          "$RUNNER_TEMP/system1-wheel/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/system1-wheel/bin/system1" decide "Read project documentation" --schema triage --json
          "$RUNNER_TEMP/system1-wheel/bin/python" -c "import reflex, system1; assert reflex.System1Engine is system1.System1Engine; from importlib.resources import files; assert files('system1.proto').joinpath('system1.proto').is_file(); assert files('reflex.proto').joinpath('system1.proto').is_file()"
      - name: Reproduce teaching quality and recorded Jev comparison
        run: "$RUNNER_TEMP/system1-wheel/bin/python benchmarks/quality/evaluate_release.py"
