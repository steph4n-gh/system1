syntax = "proto3";

package reflex.v1;

// SystemOneService exposes the System 1 decision engine over gRPC for polyglot
// agent stacks (TypeScript, Go, Rust, etc.).
service SystemOneService {
  // Evaluate a prompt against a typed decision schema.
  rpc Decide(DecideRequest) returns (DecideResponse);

  // Run a prompt through the fail-closed guard reference monitor.
  rpc Guard(GuardRequest) returns (GuardResponse);

  // Cryptographically verify a previously emitted decision receipt.
  rpc VerifyReceipt(VerifyReceiptRequest) returns (VerifyReceiptResponse);

  // Lightweight liveness / readiness probe.
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

// ---------------------------------------------------------------------------
// Decide
// ---------------------------------------------------------------------------

message DecideRequest {
  // The natural-language prompt to evaluate.
  string prompt = 1;

  // Schema name to use (e.g. "triage", "guard", or a custom loaded name).
  string schema_name = 2;

  // Optional telemetry key-value pairs forwarded to the engine.
  map<string, string> telemetry = 3;

  // Conformal significance level (default 0.05 for 95% coverage).
  double alpha = 4;
}

message DecideResponse {
  // Schema that produced this decision.
  string schema_name = 1;
  string schema_digest = 2;

  // Echo of the input prompt.
  string prompt = 3;

  // Per-field decision values (JSON-encoded for polymorphic types).
  map<string, string> values = 4;

  // Per-field calibrated confidence [0, 1].
  map<string, double> confidences = 5;

  // Per-field conformal prediction sets.
  map<string, ConformalSet> conformal_sets = 6;

  // Total single-pass latency in milliseconds.
  double latency_ms = 7;

  // Whether the decision was flagged as ambiguous.
  bool is_ambiguous = 8;

  // Whether any field triggered escalation.
  bool escalated = 9;

  // JSON-serialised receipt for offline verification.
  bytes receipt_json = 10;

  // Fields that were escalated due to ambiguity.
  repeated string escalated_fields = 11;
}

message ConformalSet {
  repeated string members = 1;
}

// ---------------------------------------------------------------------------
// Guard
// ---------------------------------------------------------------------------

message GuardRequest {
  // Natural-language description of the action to guard.
  string prompt = 1;

  // Schema name (defaults to "guard" if empty).
  string schema_name = 2;

  // Optional telemetry key-value pairs.
  map<string, string> telemetry = 3;

  // Conformal significance level.
  double alpha = 4;
}

// Guard outcome enum.
enum GuardOutcome {
  GUARD_OUTCOME_UNSPECIFIED = 0;
  ALLOW = 1;
  DENY = 2;
  REQUIRE_APPROVAL = 3;
}

message GuardResponse {
  // The guard's verdict.
  GuardOutcome outcome = 1;

  // Human-readable reason for the verdict.
  string reason = 2;

  // Per-field values from the underlying decision.
  map<string, string> values = 3;

  // Per-field calibrated confidences.
  map<string, double> confidences = 4;

  // Per-field conformal prediction sets.
  map<string, ConformalSet> conformal_sets = 5;

  // Decision latency in milliseconds.
  double latency_ms = 6;

  // JSON-serialised receipt.
  bytes receipt_json = 7;
}

// ---------------------------------------------------------------------------
// VerifyReceipt
// ---------------------------------------------------------------------------

message VerifyReceiptRequest {
  // The JSON-encoded receipt to verify.
  bytes receipt_json = 1;

  // Optional Ed25519 public key (hex-encoded) for signature verification.
  string public_key_hex = 2;
}

message VerifyReceiptResponse {
  // Whether the receipt passed all integrity checks.
  bool verified = 1;

  // Decision ID from the receipt (if parseable).
  string decision_id = 2;

  // Receipt digest (if parseable).
  string receipt_digest = 3;

  // Error message if verification failed.
  string error = 4;
}

// ---------------------------------------------------------------------------
// HealthCheck
// ---------------------------------------------------------------------------

message HealthCheckRequest {}

message HealthCheckResponse {
  enum ServingStatus {
    UNKNOWN = 0;
    SERVING = 1;
    NOT_SERVING = 2;
  }

  ServingStatus status = 1;

  // Loaded schema names.
  repeated string loaded_schemas = 2;

  // Server version string.
  string version = 3;
}
